    <script>
      (function() {
        try {
          var localTheme = localStorage.getItem('theme');
          if (localTheme === 'dark' || (!localTheme && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          } else {
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {}
      })();

    <style>
      html {
        height: auto;
        /* clip (not hidden) prevents horizontal scroll WITHOUT creating a
           scroll container — required so position: sticky keeps working. */
        overflow-x: clip;

      body {

      a, button, [role="button"] {
        cursor: none;

      /* Touch devices have no pointer — restore the native cursor and skip the custom one */
      @media (hover: none), (pointer: coarse) {
        body,
        a, button, [role="button"] {
          cursor: auto;
        }
      }

      /* Hide the native scrollbar (Lenis drives smooth scroll) */
      html::-webkit-scrollbar,
      body::-webkit-scrollbar {
        width: 0;
        height: 0;
        display: none;
      }
      html,
      body {
        scrollbar-width: none;
        -ms-overflow-style: none;

      .writing-vertical-rl {
        writing-mode: vertical-rl;
      }

      /* When the desktop portrait-travel layer is active, the in-flow slot
         images (hero + about) are hidden — the single fixed traveling image
         represents them. On mobile / reduced-motion the layer never activates,
         so these stay visible. The travel layer overrides opacity inline on
         the about image at the landing frame for a seamless handoff. */
      [data-portrait-travel='on'] .travel-hide {
        opacity: 0;
      }
      /* The hero slot's own frame (shadow) is suppressed while traveling — the
         single fixed image carries the frame, so nothing is left behind. */
      [data-portrait-travel='on'] .travel-hide-frame {
        box-shadow: none;
        background: transparent;
      }

      .bg-noise {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: 9999;
        opacity: 0.03;
        background-image: url("https://www.transparenttextures.com/patterns/black-thread.png");
      }

      html.lenis, html.lenis body {
        height: auto;
      }
      .lenis.lenis-smooth {
        scroll-behavior: auto !important;
      }
      .lenis.lenis-smooth [data-lenis-prevent] {
        overscroll-behavior: contain;
      }
      .lenis.lenis-stopped {
        overflow: hidden;
      }
      .lenis.lenis-scrolling iframe {
        pointer-events: none;
      }

      /* Keyboard-only focus ring. The custom cursor sets `cursor: none`
         globally, so :focus-visible is the sole feedback keyboard users get
         for where focus is — it never fires for mouse/touch clicks, so
         pointer-driven visual design is unaffected. */
      a:focus-visible,
      button:focus-visible,
      [role='button']:focus-visible,
      input:focus-visible,
      textarea:focus-visible {
        outline: 2px solid #ccff00;
        outline-offset: 3px;
        border-radius: 2px;
      }

    </style>
